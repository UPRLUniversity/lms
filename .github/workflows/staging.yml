name: Deploy Laravel Backend API

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, curl, openssl, pdo, pdo_mysql, tokenizer, bcmath, gd, zip, intl
          coverage: none

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 4. Install Node dependencies
      - name: Install Node dependencies
        run: npm ci

      # 5. Build frontend
      - name: Build frontend assets
        run: npm run build

      # 6. SSL diagnostics
      - name: Check SSL and Composer
        run: |
          echo "===== PHP ====="
          php -v

          echo "===== CURL ====="
          curl --version

          echo "===== OPENSSL ====="
          openssl version

          echo "===== SSL ENVIRONMENT ====="
          env | grep -Ei 'SSL|CURL|CERT|PROXY' || true

          echo "===== GITHUB API SSL TEST ====="
          curl -Iv https://api.github.com

          echo "===== COMPOSER ====="
          composer --version

          echo "===== COMPOSER DIAGNOSE ====="
          composer diagnose

      # 7. Install Composer dependencies
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist \
            -vvv

      # 8. Deploy files to VPS
      - name: Deploy to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: ".,!.git,!.github,!tests,!.env,node_modules"
          target: "/var/www/lms"
          rm: false

      # 9. Run Laravel commands on VPS
      - name: Run deployment scripts on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22

          script: |
            set -e

            cd /var/www/lms

            echo "Starting Laravel deployment..."

            PHP_BIN="$(command -v php || echo /usr/bin/php)"

            echo "PHP:"
            ${PHP_BIN} -v

            # Permissions
            sudo chmod -R 775 storage bootstrap/cache

            # AlmaLinux normally uses apache for PHP-FPM
            sudo chown -R apache:apache storage bootstrap/cache

            # Clear existing caches
            ${PHP_BIN} artisan optimize:clear

            # Database migrations
            ${PHP_BIN} artisan migrate --force

            # Storage link
            ${PHP_BIN} artisan storage:link || true

            # Rebuild Laravel caches
            ${PHP_BIN} artisan config:cache
            ${PHP_BIN} artisan route:cache
            ${PHP_BIN} artisan view:cache

            # Clear application cache
            ${PHP_BIN} artisan cache:clear

            # Restart queue worker
            sudo systemctl restart uprl_lms-worker

            # Restart PHP-FPM
            sudo systemctl restart php-fpm || true
            sudo systemctl restart php8.4-fpm || true

            # Reload Nginx
            sudo systemctl reload nginx

            echo "Laravel deployment completed successfully."