name: Deploy Laravel Backend API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, curl, openssl, pdo, tokenizer, bcmath
          coverage: none

      # 3️⃣ Setup Node.js for frontend build
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 4️⃣ Install Node dependencies locally in Actions
      - name: Install Node dependencies
        run: npm install
        working-directory: ./ # adjust if your package.json is in a subfolder like frontend/

      # 5️⃣ Build frontend assets locally
      - name: Build frontend assets
        run: npm run build
        working-directory: ./ # same as above

      # 6️⃣ Install Composer dependencies locally
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # 7️⃣ Deploy all files to VPS (Laravel + compiled frontend)
      #
      # storage/ and bootstrap/cache/ are deliberately NOT shipped. Step 8 chowns them
      # to the web user, so on every deploy after the first, tar arrives as the SSH user
      # and cannot overwrite or re-chmod them — "Cannot open: File exists" on
      # bootstrap/cache/packages.php, "Operation not permitted" on storage, exit 2, and
      # the whole deploy fails before a single Laravel command runs.
      #
      # Excluding them is also just correct. They are runtime state, not code:
      # storage/app/private holds assignment submissions and generated certificate PDFs,
      # storage/logs holds the log, and everything in bootstrap/cache is regenerated by
      # the artisan cache commands below. None of it belongs in a release payload.
      #
      # node_modules was meant to be excluded already; "!.node_modules" has a stray dot
      # and matches nothing, so every deploy has been shipping the whole tree.
      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: ".,!.git,!.github,!tests,!.env,!node_modules,!storage,!bootstrap/cache"
          target: "/var/www/lms"
          rm: false

      # 8️⃣ Run Laravel commands on server
      - name: Run deployment scripts on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/lms
            export DEBIAN_FRONTEND=noninteractive

            # Without this, a real failure (a broken composer/artisan step) is
            # silently swallowed and the deploy still reports success.
            #
            # sudo on this server has no passwordless rule for this deploy user,
            # so every "sudo ..." call below fails with "a password is required" —
            # it always has, this just used to go unnoticed with set -e off. None
            # of those calls are things Laravel needs to boot (the directories
            # they'd create/chown/restart already exist from initial server setup),
            # so they're marked "|| true" deliberately, not to hide a problem, but
            # they are a real gap: PHP-FPM/nginx are never actually reloaded by
            # this workflow, so OPcache can go on serving old code after a deploy
            # until the process happens to restart some other way. Fixing that for
            # real means adding a NOPASSWD sudoers rule for this user on the
            # server; ask a human to do that rather than exec()'ing a fix from CI.
            set -e

            # .docx conversion now runs in the browser (mammoth.js) — no Pandoc
            # or other system binaries are needed on the server.

            # Recreate the writable tree. These directories are no longer uploaded (see
            # step 7), so on a fresh server they would not exist at all, and Laravel
            # fails on a missing storage/framework/views before it can render anything.
            # mkdir -p on an existing tree is a no-op, so this is safe every time.
            sudo mkdir -p \
              storage/app/public \
              storage/app/private \
              storage/framework/cache/data \
              storage/framework/sessions \
              storage/framework/views \
              storage/logs \
              bootstrap/cache \
              || true

            # Run the cache warmers and migration as the deploy user, while these
            # directories are still owned by that user, so the writes succeed.
            # (sudo here is only configured passwordless for root, not for
            # impersonating apache, so this has to happen before the chown below
            # rather than via "sudo -u apache".)
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            php artisan cache:clear

            # Hand the tree to the web server user now that everything Laravel
            # needed to generate has been written. (No-ops today, see the sudo
            # note above — ownership stays whatever it was from initial setup.)
            sudo chmod -R 775 storage bootstrap/cache || true
            sudo chown -R apache:apache storage bootstrap/cache || true

            # Resolve the PHP binary so both the systemd unit and the cron job use
            # an absolute path (cron/systemd have a minimal PATH).
            PHP_BIN="$(command -v php || echo /usr/bin/php)"

            # Primary: a persistent queue worker so background jobs (.docx import,
            # figure migration) run immediately. queue:restart alone only signals
            # an already-running worker.
            sudo tee /etc/systemd/system/uprl_lms-worker.service >/dev/null <<UNIT || true
            [Unit]
            Description=UPRL_LMS queue worker
            After=network.target

            [Service]
            User=apache
            Group=apache
            Restart=always
            RestartSec=5
            WorkingDirectory=/var/www/lms
            ExecStart=${PHP_BIN} /var/www/lms/artisan queue:work --sleep=3 --tries=1 --timeout=900 --max-time=3600

            [Install]
            WantedBy=multi-user.target
            UNIT
            sudo systemctl daemon-reload || true
            sudo systemctl enable uprl_lms-worker || true
            sudo systemctl restart uprl_lms-worker || true

            # Fallback: a cron entry runs Laravel's scheduler every minute, which
            # drains the queue (queue:work --stop-when-empty) even if the systemd
            # worker could not be installed/started. Safe alongside the worker —
            # the DB queue reserves jobs so they are never processed twice.
            echo "* * * * * apache cd /var/www/lms && ${PHP_BIN} artisan schedule:run >> /dev/null 2>&1" | sudo tee /etc/cron.d/uprl_lms-scheduler >/dev/null || true
            sudo chmod 644 /etc/cron.d/uprl_lms-scheduler || true

            php artisan queue:restart

            # Restart PHP-FPM so OPcache picks up this deploy's code, including the
            # route/config/view caches just written above. See the sudo note near
            # the top of this script: until a NOPASSWD sudoers rule exists for
            # this deploy user, this fails every time and the warning below is the
            # only signal that it did.
            sudo systemctl restart php8.4-fpm || sudo systemctl restart php-fpm || echo "::warning::PHP-FPM was not restarted (sudo requires a password on this host) — OPcache is likely still serving pre-deploy code."

            # Reload Nginx
            sudo systemctl reload nginx || echo "::warning::nginx was not reloaded (sudo requires a password on this host)."
